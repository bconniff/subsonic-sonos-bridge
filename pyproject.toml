[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subsonic-sonos-bridge"
version = "0.1.0"
description = "Bridge between Subsonic API and Sonos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.38",
    "uvicorn[standard]>=0.30",
    "soco>=0.30",
    "py-opensonic>=10.3.0",
    "aiohttp>=3.14.3",
]

[project.scripts]
subsonic-sonos-bridge = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
